<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#fff"/>
  <text x="40" y="46" font-size="26" font-weight="700" fill="#111">Mockup: ESP32 DevKit + MAX3232-Modul (HW-044)</text>
  <text x="40" y="72" font-size="15" fill="#555">Nur 4 Kabel. VCC unbedingt an 3V3 (nicht an VIN/5V), sonst bekommt der ESP32 5-V-Pegel auf RX.</text>

  <!-- ESP32 DevKit (right header, bottom part) -->
  <rect x="60" y="110" width="330" height="560" rx="14" fill="#1c1f24"/>
  <rect x="120" y="130" width="170" height="150" rx="6" fill="#b9bec6"/>
  <text x="205" y="210" font-size="20" font-weight="700" fill="#444" text-anchor="middle">ESP-32</text>
  <text x="90" y="310" font-size="16" font-weight="700" fill="#fff">ESP32 DevKit</text>
  <text x="90" y="332" font-size="13" fill="#aab4c0">rechte Stiftleiste (unten)</text>
  <rect x="190" y="630" width="60" height="30" rx="5" fill="#9e9e9e"/>
  <text x="220" y="650" font-size="12" fill="#111" text-anchor="middle">USB-C</text>
  <text x="90" y="600" font-size="12" fill="#aab4c0">LED „D2“ = Status</text>
  <text x="90" y="618" font-size="12" fill="#aab4c0">BOOT-Taste = Taster</text>
  <g font-size="14" fill="#fff" text-anchor="end">
    <text x="335" y="385">D5</text>
    <text x="335" y="425">D17</text>
    <text x="335" y="465">D16</text>
    <text x="335" y="505">D4</text>
    <text x="335" y="545">GND</text>
    <text x="335" y="585">3V3</text>
  </g>
  <g fill="#c9a227">
    <circle cx="360" cy="380" r="9"/><circle cx="360" cy="420" r="9"/><circle cx="360" cy="460" r="9"/>
    <circle cx="360" cy="500" r="9"/><circle cx="360" cy="540" r="9"/><circle cx="360" cy="580" r="9"/>
  </g>
  <text x="290" y="520" font-size="11" fill="#6b7785" text-anchor="end">(D2, D15 …)</text>

  <!-- HW-044 -->
  <rect x="760" y="360" width="270" height="260" rx="10" fill="#1f4fa3"/>
  <text x="780" y="392" font-size="16" font-weight="700" fill="#fff">MAX3232-Modul HW-044</text>
  <g font-size="14" fill="#fff">
    <text x="800" y="425">TXD</text><text x="800" y="465">RXD</text><text x="800" y="545">GND</text><text x="800" y="585">VCC</text>
  </g>
  <g fill="#c9a227">
    <circle cx="775" cy="420" r="9"/><circle cx="775" cy="460" r="9"/><circle cx="775" cy="540" r="9"/><circle cx="775" cy="580" r="9"/>
  </g>
  <!-- DB9 female -->
  <rect x="900" y="430" width="150" height="115" rx="8" fill="#222"/>
  <path d="M915 452 h120 l-12 58 h-96 z" fill="#3a3a3a" stroke="#888"/>
  <g fill="#000" stroke="#aaa" stroke-width="1.5">
    <circle cx="1019" cy="470" r="5"/><circle cx="997" cy="470" r="5"/><circle cx="975" cy="470" r="5"/><circle cx="953" cy="470" r="5"/><circle cx="931" cy="470" r="5"/>
    <circle cx="1008" cy="493" r="5"/><circle cx="986" cy="493" r="5"/><circle cx="964" cy="493" r="5"/><circle cx="942" cy="493" r="5"/>
  </g>
  <g font-size="11" fill="#ddd" text-anchor="middle">
    <text x="1019" y="462">1</text><text x="997" y="462">2</text><text x="975" y="462">3</text><text x="953" y="462">4</text><text x="931" y="462">5</text>
  </g>
  <text x="975" y="522" font-size="11" fill="#ddd" text-anchor="middle">DB9-Buchse</text>
  <text x="975" y="535" font-size="11" fill="#ddd" text-anchor="middle">(Blick auf Steckseite)</text>

  <!-- wires -->
  <polyline points="369,420 775,420" fill="none" stroke="#f1c40f" stroke-width="5"/>
  <polyline points="369,460 775,460" fill="none" stroke="#1e88e5" stroke-width="5"/>
  <polyline points="369,540 775,540" fill="none" stroke="#212121" stroke-width="5"/>
  <polyline points="369,580 775,580" fill="none" stroke="#f39c12" stroke-width="5"/>
  <g font-size="13" font-weight="700">
    <text x="470" y="410" fill="#8a6d00">D17 (TX2)  →  TXD</text>
    <text x="470" y="450" fill="#1565c0">D16 (RX2)  ←  RXD</text>
    <text x="470" y="530" fill="#212121">GND  —  GND</text>
    <text x="470" y="570" fill="#c26a00">3V3  →  VCC</text>
  </g>
  <text x="470" y="494" font-size="12" fill="#555">Kein Echo? Im Web-UI „RX/TX tauschen“</text>
  <text x="470" y="510" font-size="12" fill="#555">anhaken – kein Umstecken nötig.</text>

  <!-- loopback -->
  <rect x="760" y="110" width="400" height="200" rx="10" fill="#f4f6f8" stroke="#d0d6dd"/>
  <text x="780" y="140" font-size="16" font-weight="700" fill="#111">Test 1: Loopback (ohne Gerät)</text>
  <path d="M800 170 h150 l-14 60 h-122 z" fill="#3a3a3a" stroke="#888"/>
  <g fill="#000" stroke="#aaa" stroke-width="1.5">
    <circle cx="930" cy="188" r="6"/><circle cx="903" cy="188" r="6"/><circle cx="876" cy="188" r="6"/><circle cx="849" cy="188" r="6"/><circle cx="822" cy="188" r="6"/>
    <circle cx="916" cy="212" r="6"/><circle cx="889" cy="212" r="6"/><circle cx="862" cy="212" r="6"/><circle cx="835" cy="212" r="6"/>
  </g>
  <path d="M903 188 C 900 158, 879 158, 876 188" fill="none" stroke="#e53935" stroke-width="4"/>
  <g font-size="11" fill="#333" text-anchor="middle"><text x="930" y="252">1</text><text x="903" y="252">2</text><text x="876" y="252">3</text><text x="822" y="252">5</text></g>
  <text x="970" y="185" font-size="13" fill="#333">Pin 2 + 3 brücken</text>
  <text x="970" y="203" font-size="13" fill="#333">(Büroklammer/Draht)</text>
  <text x="780" y="285" font-size="13" fill="#333">→ alles, was du im Web-Terminal tippst, kommt zurück.</text>

  <!-- test 2 -->
  <text x="40" y="712" font-size="14" fill="#111"><tspan font-weight="700">Test 2 am Switch:</tspan> Cisco-Konsolenkabel (DB9-Buchse) ↔ HW-044 (DB9-Buchse) mit 3 Stecker-Stecker-Jumpern: HW-044 Pin 2 → Kabel Pin 3,</text>
  <text x="40" y="734" font-size="14" fill="#111">HW-044 Pin 3 → Kabel Pin 2, Pin 5 → Pin 5. Keine Ausgabe? Jumper an Pin 2/3 tauschen (unschädlich) – oder DB9-Nullmodem-Adapter Stecker/Stecker nehmen.</text>
</svg>
