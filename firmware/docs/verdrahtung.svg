<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="900" fill="#ffffff"/>
  <text x="40" y="46" font-size="26" font-weight="700" fill="#111">RS232 Web Console – Verdrahtung</text>
  <text x="40" y="72" font-size="15" fill="#555">Farbige Marken = gleiche Leitung. Pin-Namen wie im Siebdruck am Header J4 (1,27 mm, 2×15).</text>

  <!-- ================= T-RSS3 ================= -->
  <rect x="40" y="100" width="1120" height="250" rx="14" fill="#1d2126"/>
  <text x="64" y="134" font-size="19" font-weight="700" fill="#fff">LilyGO T-RSS3 – Header J4 (Draufsicht, ESP32-Modul links)</text>
  <g font-size="14" fill="#fff" text-anchor="middle">
    <text x="130" y="172">3V3</text><text x="190" y="172">10</text><text x="250" y="172">11</text><text x="310" y="172">12</text><text x="370" y="172">13</text><text x="430" y="172">14</text><text x="490" y="172">15</text><text x="550" y="172">16</text><text x="610" y="172">17</text><text x="670" y="172">18</text><text x="730" y="172">21</text><text x="790" y="172">47</text><text x="850" y="172">33</text><text x="910" y="172">34</text><text x="970" y="172">48</text>
  </g>
  <rect x="100" y="182" width="900" height="72" rx="6" fill="#0b0d0f" stroke="#555"/>
  <g fill="#c9a227">
    <circle cx="130" cy="200" r="9"/><circle cx="190" cy="200" r="9"/><circle cx="250" cy="200" r="9"/><circle cx="310" cy="200" r="9"/><circle cx="370" cy="200" r="9"/><circle cx="430" cy="200" r="9"/><circle cx="490" cy="200" r="9"/><circle cx="550" cy="200" r="9"/><circle cx="610" cy="200" r="9"/><circle cx="670" cy="200" r="9"/><circle cx="730" cy="200" r="9"/><circle cx="790" cy="200" r="9"/><circle cx="850" cy="200" r="9"/><circle cx="910" cy="200" r="9"/><circle cx="970" cy="200" r="9"/>
    <circle cx="130" cy="236" r="9"/><circle cx="190" cy="236" r="9"/><circle cx="250" cy="236" r="9"/><circle cx="310" cy="236" r="9"/><circle cx="370" cy="236" r="9"/><circle cx="430" cy="236" r="9"/><circle cx="490" cy="236" r="9"/><circle cx="550" cy="236" r="9"/><circle cx="610" cy="236" r="9"/><circle cx="670" cy="236" r="9"/><circle cx="730" cy="236" r="9"/><circle cx="790" cy="236" r="9"/><circle cx="850" cy="236" r="9"/><circle cx="910" cy="236" r="9"/><circle cx="970" cy="236" r="9"/>
  </g>
  <g font-size="14" fill="#fff" text-anchor="middle">
    <text x="130" y="276">5V</text><text x="190" y="276">09</text><text x="250" y="276">08</text><text x="310" y="276">07</text><text x="370" y="276">06</text><text x="430" y="276">G</text><text x="490" y="276">G</text><text x="550" y="276">RX</text><text x="610" y="276">TX</text><text x="670" y="276">40</text><text x="730" y="276">39</text><text x="790" y="276">38</text><text x="850" y="276">37</text><text x="910" y="276">36</text><text x="970" y="276">35</text>
  </g>
  <!-- highlight used pins -->
  <g fill="none" stroke-width="4">
    <circle cx="130" cy="200" r="13" stroke="#f39c12"/>
    <circle cx="130" cy="236" r="13" stroke="#e53935"/>
    <circle cx="190" cy="236" r="13" stroke="#f1c40f"/>
    <circle cx="250" cy="236" r="13" stroke="#1e88e5"/>
    <circle cx="310" cy="236" r="13" stroke="#2e7d32"/>
    <circle cx="370" cy="236" r="13" stroke="#8e44ad"/>
    <circle cx="430" cy="236" r="13" stroke="#9e9e9e"/>
    <circle cx="490" cy="236" r="13" stroke="#9e9e9e"/>
  </g>
  <!-- function tags -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="96" y="290" width="68" height="24" rx="5" fill="#e53935"/><text x="130" y="307" fill="#fff">5V ein</text>
    <rect x="160" y="318" width="60" height="24" rx="5" fill="#f1c40f"/><text x="190" y="335" fill="#111">SCL</text>
    <rect x="222" y="290" width="56" height="24" rx="5" fill="#1e88e5"/><text x="250" y="307" fill="#fff">SDA</text>
    <rect x="280" y="318" width="60" height="24" rx="5" fill="#2e7d32"/><text x="310" y="335" fill="#fff">AKKU</text>
    <rect x="336" y="290" width="68" height="24" rx="5" fill="#8e44ad"/><text x="370" y="307" fill="#fff">TASTER</text>
    <rect x="410" y="318" width="100" height="24" rx="5" fill="#9e9e9e"/><text x="460" y="335" fill="#111">GND</text>
  </g>
  <rect x="96" y="102" width="0" height="0"/>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="1010" y="188" width="130" height="24" rx="5" fill="#f39c12"/><text x="1075" y="205" fill="#111">3V3 = OLED VCC</text>
  </g>
  <g font-size="13" fill="#aab4c0">
    <text x="560" y="310">DB9-Buchse: Pin 2 = TX · Pin 3 = RX · Pin 5 = GND (isoliert)</text>
    <text x="560" y="330">USB-C: nur Flashen/Debug · danach Updates per WLAN</text>
  </g>

  <!-- ================= OLED ================= -->
  <rect x="40" y="390" width="250" height="170" rx="10" fill="#0d47a1"/>
  <text x="58" y="418" font-size="16" font-weight="700" fill="#fff">OLED 128×64 I²C</text>
  <rect x="58" y="432" width="120" height="70" rx="3" fill="#050505"/>
  <text x="68" y="458" font-size="12" fill="#9fd3ff" font-family="monospace">RS232  80%</text>
  <text x="68" y="478" font-size="12" fill="#9fd3ff" font-family="monospace">9600 8N1</text>
  <g font-size="14" fill="#fff" text-anchor="end"><text x="270" y="444">VCC</text><text x="270" y="470">GND</text><text x="270" y="496">SCL</text><text x="270" y="522">SDA</text></g>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="300" y="430" width="92" height="20" rx="4" fill="#f39c12"/><text x="346" y="445" fill="#111">→ J4 3V3</text>
    <rect x="300" y="456" width="92" height="20" rx="4" fill="#9e9e9e"/><text x="346" y="471" fill="#111">→ J4 G</text>
    <rect x="300" y="482" width="92" height="20" rx="4" fill="#f1c40f"/><text x="346" y="497" fill="#111">→ J4 09</text>
    <rect x="300" y="508" width="92" height="20" rx="4" fill="#1e88e5"/><text x="346" y="523" fill="#fff">→ J4 08</text>
  </g>
  <text x="40" y="580" font-size="12" fill="#555">SSD1306 0,96″ oder SH1106 1,3″ (Typ im Web-UI wählbar).</text>
  <text x="40" y="596" font-size="12" fill="#c62828">Pin-Reihenfolge VCC/GND ist je nach Modul verschieden!</text>

  <!-- ================= Akku-Messung ================= -->
  <text x="470" y="408" font-size="16" font-weight="700" fill="#111">Akku-Messung</text>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="470" y="420" width="92" height="20" rx="4" fill="#e53935"/><text x="516" y="435" fill="#fff">LiPo +</text>
  </g>
  <line x1="516" y1="440" x2="516" y2="456" stroke="#111" stroke-width="3"/>
  <rect x="504" y="456" width="24" height="40" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="538" y="481" font-size="13" fill="#111">R1 100 kΩ</text>
  <line x1="516" y1="496" x2="516" y2="516" stroke="#2e7d32" stroke-width="3"/>
  <circle cx="516" cy="516" r="5" fill="#2e7d32"/>
  <line x1="516" y1="516" x2="600" y2="516" stroke="#2e7d32" stroke-width="3"/>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="600" y="506" width="92" height="20" rx="4" fill="#2e7d32"/><text x="646" y="521" fill="#fff">→ J4 07</text>
  </g>
  <line x1="516" y1="516" x2="516" y2="530" stroke="#2e7d32" stroke-width="3"/>
  <rect x="504" y="530" width="24" height="40" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="538" y="555" font-size="13" fill="#111">R2 100 kΩ</text>
  <line x1="516" y1="570" x2="516" y2="596" stroke="#111" stroke-width="3"/>
  <polyline points="516,516 470,516 470,540" fill="none" stroke="#2e7d32" stroke-width="3"/>
  <line x1="456" y1="540" x2="484" y2="540" stroke="#111" stroke-width="3"/>
  <line x1="456" y1="548" x2="484" y2="548" stroke="#111" stroke-width="3"/>
  <polyline points="470,548 470,596 516,596" fill="none" stroke="#111" stroke-width="3"/>
  <text x="404" y="548" font-size="12" fill="#111">100 nF</text>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="470" y="600" width="92" height="20" rx="4" fill="#9e9e9e"/><text x="516" y="615" fill="#111">GND</text>
  </g>

  <!-- ================= Taster ================= -->
  <text x="800" y="408" font-size="16" font-weight="700" fill="#111">Taster im Gehäuse (optional)</text>
  <circle cx="860" cy="470" r="26" fill="#eee" stroke="#333" stroke-width="2"/>
  <circle cx="860" cy="470" r="14" fill="#c62828"/>
  <line x1="834" y1="470" x2="812" y2="470" stroke="#8e44ad" stroke-width="3"/>
  <line x1="886" y1="470" x2="908" y2="470" stroke="#111" stroke-width="3"/>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="720" y="460" width="92" height="20" rx="4" fill="#8e44ad"/><text x="766" y="475" fill="#fff">→ J4 06</text>
    <rect x="908" y="460" width="70" height="20" rx="4" fill="#9e9e9e"/><text x="943" y="475" fill="#111">GND</text>
  </g>
  <text x="720" y="520" font-size="13" fill="#333">Gleiche Funktion wie Board-Taste IO5:</text>
  <text x="720" y="538" font-size="13" fill="#333">kurz = Seite / Display an · lang = Baudrate</text>
  <text x="720" y="556" font-size="13" fill="#333">beim Einschalten 5 s halten = Werksreset</text>

  <!-- ================= Stromversorgung ================= -->
  <text x="40" y="650" font-size="16" font-weight="700" fill="#111">Stromversorgung</text>
  <rect x="40" y="670" width="170" height="100" rx="10" fill="#3b6fb6"/>
  <text x="56" y="704" font-size="15" font-weight="700" fill="#fff">LiPo 1S 3,7 V</text>
  <text x="56" y="726" font-size="12" fill="#e3edf9">z. B. 103450 · 2000 mAh</text>
  <text x="56" y="744" font-size="12" fill="#e3edf9">mit Schutzschaltung</text>
  <text x="198" y="694" font-size="15" font-weight="700" fill="#fff" text-anchor="end">+</text>
  <text x="198" y="762" font-size="15" font-weight="700" fill="#fff" text-anchor="end">−</text>

  <rect x="290" y="660" width="220" height="140" rx="10" fill="#2e7d32"/>
  <text x="306" y="688" font-size="15" font-weight="700" fill="#fff">Lade-/Boost-Modul</text>
  <text x="306" y="706" font-size="12" fill="#dcedc8">z. B. IP5306 Type-C, 5 V</text>
  <g font-size="13" fill="#fff"><text x="306" y="738">B+</text><text x="306" y="772">B−</text></g>
  <g font-size="13" fill="#fff" text-anchor="end"><text x="496" y="738">OUT+ 5V</text><text x="496" y="772">OUT−</text></g>
  <rect x="365" y="790" width="70" height="22" rx="8" fill="#9e9e9e" stroke="#555"/>
  <text x="400" y="806" font-size="11" fill="#111" text-anchor="middle">USB-C</text>
  <text x="400" y="832" font-size="12" fill="#555" text-anchor="middle">Laden (auch im Betrieb)</text>

  <polyline points="210,690 250,690 250,734 300,734" fill="none" stroke="#e53935" stroke-width="4"/>
  <polyline points="210,758 250,758 250,768 300,768" fill="none" stroke="#212121" stroke-width="4"/>
  <circle cx="250" cy="690" r="5" fill="#e53935"/>
  <polyline points="250,690 250,650 262,650" fill="none" stroke="#e53935" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="266" y="654" font-size="12" fill="#e53935">→ R1 (Akku-Messung)</text>

  <rect x="580" y="714" width="84" height="40" rx="6" fill="#fafafa" stroke="#333" stroke-width="2"/>
  <rect x="592" y="724" width="28" height="20" rx="3" fill="#333"/>
  <text x="622" y="774" font-size="12" fill="#333" text-anchor="middle">Schiebeschalter</text>
  <polyline points="500,734 580,734" fill="none" stroke="#e53935" stroke-width="4"/>
  <polyline points="664,734 720,734" fill="none" stroke="#e53935" stroke-width="4"/>
  <polyline points="500,768 540,768 540,800 720,800" fill="none" stroke="#212121" stroke-width="4"/>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="720" y="724" width="92" height="20" rx="4" fill="#e53935"/><text x="766" y="739" fill="#fff">→ J4 5V</text>
    <rect x="720" y="790" width="92" height="20" rx="4" fill="#9e9e9e"/><text x="766" y="805" fill="#111">→ J4 G</text>
  </g>
  <g font-size="12.5" fill="#333">
    <text x="840" y="700">• 5V an J4 liegt hinter der USB-Diode D6:</text>
    <text x="852" y="718">USB-C am Board + Akku gleichzeitig ist ok.</text>
    <text x="840" y="742">• Isolierte RS232/RS485-Module brauchen</text>
    <text x="852" y="760">4,75–5,25 V → Boost-Ausgang direkt,</text>
    <text x="852" y="778">keine zusätzliche Diode.</text>
    <text x="840" y="802">• Akku-Kalibrierung: BAT_CAL in config.h</text>
  </g>
</svg>
