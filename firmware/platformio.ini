; RS232 Web Console for the Waveshare ESP32-S3-Touch-LCD-2 (ESP32-S3R8, 16 MB
; flash, USB-C on the native USB port). Colour touch UI on the 2" LCD, Bluetooth
; LE console, SD slot.
; Build:  pio run            Flash (USB-C):  pio run -t upload
; Monitor: pio device monitor

; One firmware per language. The language is fixed when it is built (src/lang.h):
; touch display, web interface and messages all follow it.
;   pio run                                   English (the default)
;   pio run -e waveshare-s3-lcd2-de           German
;   pio run -e waveshare-s3-lcd2-pt           Portuguese
;   pio run -e waveshare-s3-lcd2-de -t upload flash that one

[platformio]
default_envs = waveshare-s3-lcd2

[common]
build_flags =
    -DBOARD_HAS_PSRAM             ; the display canvas lives there
    -DARDUINO_USB_MODE=1          ; native USB (Serial/JTAG)
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial = USB-C debug console
    -DCORE_DEBUG_LEVEL=1

[env:waveshare-s3-lcd2]
; espressif32 6.x = Arduino-ESP32 2.0.17 (ESP-IDF 4.4)
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = dio_opi   ; 8 MB octal PSRAM in the module
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
upload_speed = 921600
monitor_speed = 115200
build_flags =
    ${common.build_flags}
    -DUI_LANG=LANG_EN
custom_ui_lang = en
extra_scripts = pre:tools/embed_web.py
lib_deps =
    links2004/WebSockets@^2.6.1
    lovyan03/LovyanGFX@^1.2.7           ; ST7789 + CST816 touch
    h2zero/NimBLE-Arduino@^2.3.0        ; serial console over Bluetooth LE
    bblanchon/ArduinoJson@^7.2.0
    plerup/EspSoftwareSerial@^8.1.0     ; serial ports 3 + 4

[env:waveshare-s3-lcd2-de]
extends = env:waveshare-s3-lcd2
build_flags =
    ${common.build_flags}
    -DUI_LANG=LANG_DE
custom_ui_lang = de

[env:waveshare-s3-lcd2-pt]
extends = env:waveshare-s3-lcd2
build_flags =
    ${common.build_flags}
    -DUI_LANG=LANG_PT
custom_ui_lang = pt

; ---------------------------------------------------------------------------
; VIEWE UEDX80480050E-WB-A: ESP32-S3 (N16R8) with a 5" 800x480 RGB panel, GT911
; touch and an SD slot. Same firmware, same touch interface (lcd_ui.cpp) on a
; panel of another kind: parallel RGB with a frame buffer instead of SPI.
; The USB-C port is a CH340 on UART0, so Serial is the UART (no USB CDC).
;   pio run -e viewe-s3-5inch -t upload         English
;   pio run -e viewe-s3-5inch-de -t upload      German
;   pio run -e viewe-s3-5inch-pt -t upload      Portuguese
[viewe]
build_flags =
    -DBOARD_VIEWE_5INCH
    -DBOARD_HAS_PSRAM             ; frame buffer and display canvas live there
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0   ; Serial = UART0 (IO43/IO44) behind the CH340
    -DCORE_DEBUG_LEVEL=1

[env:viewe-s3-5inch]
extends = env:waveshare-s3-lcd2
build_flags =
    ${viewe.build_flags}
    -DUI_LANG=LANG_EN
custom_ui_lang = en

[env:viewe-s3-5inch-de]
extends = env:waveshare-s3-lcd2
build_flags =
    ${viewe.build_flags}
    -DUI_LANG=LANG_DE
custom_ui_lang = de

[env:viewe-s3-5inch-pt]
extends = env:waveshare-s3-lcd2
build_flags =
    ${viewe.build_flags}
    -DUI_LANG=LANG_PT
custom_ui_lang = pt
