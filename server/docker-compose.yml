# Local test set-up:  docker compose up -d --build   (see README.md)
services:
  c2server:
    build: .
    image: rs232-c2
    environment:
      # Needed for the first account and for scripts (at least 16 characters, e.g.
      # in .env). Once accounts exist it can be left empty: accounts only.
      C2_ADMIN_TOKEN: ${C2_ADMIN_TOKEN:-}
      # Sign-in with Microsoft Entra ID, if all three are set (README.md)
      C2_ENTRA_TENANT: ${C2_ENTRA_TENANT:-}
      C2_ENTRA_CLIENT_ID: ${C2_ENTRA_CLIENT_ID:-}
      C2_ENTRA_CLIENT_SECRET: ${C2_ENTRA_CLIENT_SECRET:-}
      # 1 only behind a reverse proxy that sets X-Forwarded-For
      C2_TRUST_PROXY: ${C2_TRUST_PROXY:-}
      # How devices reach the server. Inside the compose network that is the
      # service name; in the cloud, the public https:// address.
      C2_PUBLIC_URL: ${C2_PUBLIC_URL:-https://c2server:8443}
      C2_TLS: ${C2_TLS:-selfsigned}
      C2_POLL_S: ${C2_POLL_S:-30}
    ports:
      # local only by default; nothing here is meant for the internet yet. For a
      # device in the same LAN set C2_BIND to this machine's address there.
      - "${C2_BIND:-127.0.0.1}:8443:8443"
    volumes:
      - c2data:/data
    healthcheck:                 # /healthz: can the state be written?
      test: ["CMD", "/c2server", "-health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  c2data:
