<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="800" fill="#fff"/>
  <text x="40" y="46" font-size="26" font-weight="700" fill="#111">Mockup mobil: 4,8-V-NiCd-Akku am ESP32 DevKit</text>
  <text x="40" y="72" font-size="15" fill="#555">Akku an VIN + GND (linke Stiftleiste, ganz unten neben USB). Der Spannungsregler auf dem DevKit macht daraus 3,3 V.</text>

  <!-- Battery pack -->
  <rect x="60" y="130" width="230" height="190" rx="16" fill="#3d8fd6"/>
  <g fill="#357fbe"><rect x="75" y="140" width="45" height="170" rx="20"/><rect x="128" y="140" width="45" height="170" rx="20"/><rect x="181" y="140" width="45" height="170" rx="20"/><rect x="234" y="140" width="45" height="170" rx="20"/></g>
  <text x="175" y="215" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Ni-Cd 4,8 V</text>
  <text x="175" y="238" font-size="15" fill="#fff" text-anchor="middle">500 mAh (4 × AA)</text>
  <text x="175" y="262" font-size="12" fill="#e3f0fb" text-anchor="middle">voll 5,6 V · leer 4,0 V</text>
  <!-- SM-2P plug pair -->
  <rect x="330" y="200" width="40" height="56" rx="4" fill="#222"/>
  <rect x="372" y="200" width="40" height="56" rx="4" fill="#444"/>
  <text x="371" y="285" font-size="12" fill="#333" text-anchor="middle">SM-2P Stecker +</text>
  <text x="371" y="300" font-size="12" fill="#333" text-anchor="middle">Gegenstück</text>
  <path d="M290 200 C 310 200, 312 214, 330 214" fill="none" stroke="#212121" stroke-width="5"/>
  <path d="M290 250 C 310 250, 312 242, 330 242" fill="none" stroke="#e53935" stroke-width="5"/>

  <!-- black: plug -> GND -->
  <polyline points="412,214 820,214 820,540 866,540" fill="none" stroke="#212121" stroke-width="5"/>
  <text x="470" y="203" font-size="13" font-weight="700" fill="#212121">Schwarz (−) → GND</text>

  <!-- red: plug -> switch -> diode -> VIN -->
  <polyline points="412,242 450,242 450,580 510,580" fill="none" stroke="#e53935" stroke-width="5"/>
  <circle cx="515" cy="580" r="6" fill="#e53935"/>
  <line x1="515" y1="580" x2="568" y2="556" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <circle cx="575" cy="580" r="6" fill="#e53935"/>
  <text x="545" y="535" font-size="14" font-weight="700" fill="#111" text-anchor="middle">Schalter</text>
  <text x="545" y="610" font-size="12" fill="#555" text-anchor="middle">Ein/Aus im Plus</text>
  <polyline points="580,580 660,580" fill="none" stroke="#e53935" stroke-width="5"/>
  <polygon points="660,560 660,600 700,580" fill="#333"/>
  <rect x="700" y="558" width="7" height="44" fill="#333"/>
  <text x="684" y="535" font-size="14" font-weight="700" fill="#111" text-anchor="middle">Schottky-Diode</text>
  <text x="684" y="622" font-size="12" fill="#555" text-anchor="middle">1N5817 / 1N5819 / SS14</text>
  <text x="684" y="638" font-size="12" fill="#555" text-anchor="middle">Ring zeigt zum ESP32</text>
  <polyline points="707,580 866,580" fill="none" stroke="#e53935" stroke-width="5"/>
  <text x="470" y="660" font-size="13" font-weight="700" fill="#c62828">Rot (+) → Schalter → Diode → VIN</text>

  <!-- ESP32 DevKit -->
  <rect x="860" y="130" width="290" height="520" rx="14" fill="#1c1f24"/>
  <rect x="920" y="150" width="170" height="150" rx="6" fill="#b9bec6"/>
  <text x="1005" y="230" font-size="20" font-weight="700" fill="#444" text-anchor="middle">ESP-32</text>
  <text x="1005" y="340" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">ESP32 DevKit</text>
  <text x="1005" y="362" font-size="13" fill="#aab4c0" text-anchor="middle">linke Stiftleiste (unten)</text>
  <text x="1005" y="420" font-size="12" fill="#aab4c0" text-anchor="middle">rechte Leiste: MAX3232</text>
  <text x="1005" y="436" font-size="12" fill="#aab4c0" text-anchor="middle">bleibt wie gehabt</text>
  <rect x="975" y="612" width="60" height="30" rx="5" fill="#9e9e9e"/>
  <text x="1005" y="632" font-size="12" fill="#111" text-anchor="middle">USB-C</text>
  <g font-size="14" fill="#fff">
    <text x="895" y="505">D13</text>
    <text x="895" y="545">GND</text>
    <text x="895" y="585">VIN</text>
  </g>
  <g fill="#c9a227"><circle cx="875" cy="500" r="9"/><circle cx="875" cy="540" r="9"/><circle cx="875" cy="580" r="9"/></g>
  <text x="875" y="478" font-size="14" fill="#6b7785" text-anchor="middle">⋮</text>

  <!-- notes -->
  <rect x="60" y="360" width="340" height="150" rx="10" fill="#fdecea" stroke="#f5c2bd"/>
  <text x="80" y="390" font-size="16" font-weight="700" fill="#b71c1c">Achtung</text>
  <g font-size="13" fill="#5d1a1a">
    <text x="80" y="415">• Nie an 3V3: 5,6 V zerstören den ESP32.</text>
    <text x="80" y="437">• Polung prüfen: rot = Plus. Verpolt stirbt</text>
    <text x="92" y="455">der Spannungsregler.</text>
    <text x="80" y="477">• Ohne Diode: Schalter AUS, bevor USB</text>
    <text x="92" y="495">eingesteckt wird.</text>
  </g>

  <rect x="60" y="530" width="340" height="120" rx="10" fill="#f4f6f8" stroke="#d0d6dd"/>
  <text x="80" y="560" font-size="16" font-weight="700" fill="#111">Laden</text>
  <g font-size="13" fill="#333">
    <text x="80" y="585">Nur mit einem NiCd-Ladegerät (z. B. dem</text>
    <text x="80" y="605">Ladekabel vom Spielzeug). Akku dazu am</text>
    <text x="80" y="625">SM-Stecker abziehen. Laufzeit ca. 2–3 h.</text>
  </g>

  <rect x="60" y="680" width="1090" height="95" rx="10" fill="#f4f6f8" stroke="#d0d6dd"/>
  <text x="80" y="710" font-size="16" font-weight="700" fill="#111">Nicht nötig</text>
  <g font-size="13" fill="#333">
    <text x="80" y="734">• Pegelwandler (HV/LV, BSS138): Die RS232-Pegel macht schon der MAX3232, der ESP32 läuft durchgehend mit 3,3 V.</text>
    <text x="80" y="756">• USB-C-Breakout: ohne Lade-IC nutzlos. Das DevKit hat schon eine USB-C-Buchse.</text>
  </g>
</svg>
