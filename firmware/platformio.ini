; RS232 Web Console for LilyGO T-RSS3 (ESP32-S3)
; Build:  pio run            Flash (USB-C):  pio run -t upload
; Monitor: pio device monitor

[platformio]
default_envs = t-rss3
; mock-up: pio run -e esp32dev-max3232 -t upload

[env:t-rss3]
; espressif32 6.x = Arduino-ESP32 2.0.17 (ESP-IDF 4.4)
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; 4 MB is the smallest flash the T-RSS3 ships with; min_spiffs keeps two 1.9 MB
; app slots (OTA) plus ~128 kB for stored configurations and certificates
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = min_spiffs.csv
board_build.flash_mode = qio

upload_speed = 921600
monitor_speed = 115200

build_flags =
    -DARDUINO_USB_MODE=1          ; native USB (Serial/JTAG) like LilyGO examples
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial = USB-C debug console
    -DCORE_DEBUG_LEVEL=1

; packs web/ (index.html, app.js, xterm.js ...) gzipped into src/web_assets.h
extra_scripts = pre:tools/embed_web.py
build_src_filter = +<*> -<panel/>      ; the LVGL panel port belongs to the 5" board only

lib_deps =
    links2004/WebSockets@^2.6.1
    olikraus/U8g2@^2.36.5
    bblanchon/ArduinoJson@^7.2.0
    plerup/EspSoftwareSerial@^8.1.0     ; serial ports 3 + 4

; ---------------------------------------------------------------------------
; Mock-up: ESP32 DevKit (ESP32-WROOM-32, 30 pin, CH340, USB-C) + MAX3232 module
; HW-044.  Build/flash:  pio run -e esp32dev-max3232 -t upload
[env:esp32dev-max3232]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv     ; 1.9 MB app slots (OTA capable), 128 kB for stored configs
upload_speed = 921600
monitor_speed = 115200
build_flags =
    -DBOARD_ESP32_DEVKIT
    -DCORE_DEBUG_LEVEL=1
extra_scripts = pre:tools/embed_web.py
build_src_filter = +<*> -<panel/>      ; the LVGL panel port belongs to the 5" board only
lib_deps =
    links2004/WebSockets@^2.6.1
    olikraus/U8g2@^2.36.5
    bblanchon/ArduinoJson@^7.2.0
    plerup/EspSoftwareSerial@^8.1.0     ; serial ports 3 + 4

; ---------------------------------------------------------------------------
; VIEWE UEDX80480050E-WB: ESP32-S3, 5" 800x480 RGB panel, GT911 touch, SD slot.
; Needs Arduino core 3.x, so this env uses the pioarduino platform build.
; Build/flash:  pio run -e viewe-5inch -t upload
[env:viewe-5inch]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi          ; ESP32S3-MCN16R8: 16 MB flash, 8 MB octal PSRAM
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
upload_speed = 921600
monitor_speed = 115200
build_flags =
    -DBOARD_VIEWE_5INCH                      ; our board profile in config.h
    -DBOARD_VIEWE_UEDX80480050E_WB_A         ; panel definition inside ESP32_Display_Panel
    -DESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DLV_COLOR_16_SWAP=0                     ; RGB panel wants native byte order
    -DCORE_DEBUG_LEVEL=1
    -I src/panel
extra_scripts = pre:tools/embed_web.py
lib_deps =
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.2.0
    plerup/EspSoftwareSerial@^8.1.0
; order matters: ESP32_Display_Panel declares the other two as dependencies, and
; v1.0.4 is the first release whose constraint (esp-lib-utils 0.2.x) matches the
; version ESP32_IO_Expander v1.1.0 needs
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
    https://github.com/lvgl/lvgl.git#v8.4.0
